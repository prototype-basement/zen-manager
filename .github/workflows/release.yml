name: Build packages

# Merging a version bump into main publishes a release: the job below tags the
# commit when Cargo.toml names a version that has no tag yet. Pull requests get
# a quick check instead, and workflow_dispatch builds the matrix without
# publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A re-tag supersedes the run it replaces instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Decides whether this commit is a release, so the rest of the file does not
  # have to care how that was determined.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Not a push to main; building without publishing."
          elif git rev-parse "v$version" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new; this commit will be released."
          fi

  # Fast feedback on pull requests: one platform, build and tests only.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmtp-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            pkg-config
      - run: cargo test --release --locked
      - run: cargo clippy --locked -- -D warnings
        continue-on-error: true

  build:
    needs: version
    # Only for an actual release, or a manual dry run. A commit to main that
    # does not bump the version has nothing to build.
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch' 
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: libmtp is a C library, so
          # cross-compiling would mean cross-building it too.
          - label: macOS arm64
            runner: macos-15
            os: macos
          # macos-13 was retired in December 2025. macos-15-intel is GitHub's
          # last x86_64 macOS image, supported until August 2027.
          - label: macOS x86_64
            runner: macos-15-intel
            os: macos
          # Oldest supported Ubuntu, because the binary links against the
          # glibc of whatever built it and newer glibc is not backwards
          # compatible.
          - label: Linux x86_64
            runner: ubuntu-22.04
            os: linux
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            os: linux

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Not Homebrew: its bottles carry the runner's macOS version as their
      # minimum, which would stop the app launching on anything older than the
      # runner. Building from source pins the minimum to macOS 11.
      - name: Build libusb and libmtp (macOS)
        if: matrix.os == 'macos'
        run: |
          command -v pkg-config > /dev/null || brew install pkgconf
          chmod +x packaging/macos-deps.sh
          ./packaging/macos-deps.sh "$RUNNER_TEMP/macos-deps"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/macos-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # libmtp for the device, the rest are what Slint's renderer and
          # winit need to build on Linux.
          sudo apt-get install -y --no-install-recommends \
            libmtp-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            pkg-config

      - name: Test
        run: cargo test --release --locked

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          chmod +x packaging/macos-bundle.sh
          ./packaging/macos-bundle.sh
          for f in "target/release/bundle/ZEN Manager.app/Contents/MacOS/zenmanager" \
                   "target/release/bundle/ZEN Manager.app/Contents/Frameworks/"*.dylib; do
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "$(basename "$f"): minos $minos"
            [ "$minos" = "11.0" ] || { echo "::error::$f requires macOS $minos, expected 11.0"; exit 1; }
          done
          cd target/release/bundle
          # ditto preserves the bundle's symlinks and permissions; zip does not.
          version=$(grep -m1 '^version' ../../../Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          ditto -c -k --keepParent "ZEN Manager.app" \
            "../../../zen-manager-$version-macos-$(uname -m).zip"

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          chmod +x packaging/linux-package.sh
          ./packaging/linux-package.sh
          cp target/release/package/*.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: zen-manager-${{ matrix.os }}-${{ matrix.label }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' 
    runs-on: ubuntu-latest
    steps:
      # Checked out only to read the release notes written for this tag.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # docs/releases/<tag>.md is written by hand before tagging, so it can be
      # reviewed like any other change. install.md is shared by every release.
      - name: Compose release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            cat docs/releases/install.md
          } > "$RUNNER_TEMP/notes.md"

      # Creates the tag as well, so merging the bump is the whole release step.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.tar.gz
          body_path: ${{ runner.temp }}/notes.md
